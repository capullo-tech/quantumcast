name: Release

on:
  push:
    # Only version tags publish a GitHub Release. Regular pushes still run Build.yml on their own,
    # so the APK is available as a workflow artifact - this just stops every push to every branch
    # from republishing a public `preview` prerelease (clutter on a public repo). Tag with `vX.Y.Z`
    # to cut a release. (The `else` preview path in the job below is now unreachable and kept only
    # for reference / an easy revert.)
    tags:
      - 'v*' # e.g. v1.0, v20.15.10

permissions:
  contents: write

jobs:
  build:
    uses: ./.github/workflows/Build.yml
    # Reusable workflows don't get the repo secrets unless we pass them through - without this the
    # release build has no signing keystore and emits an UNSIGNED APK (green, but un-installable).
    secrets: inherit
  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout project sources
        uses: actions/checkout@v4
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: quantumcast-${{ github.sha }}
          path: ./artifacts
      - name: Create Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            tag="${{ github.ref_name }}"
            gh release create "$tag" \
              --generate-notes
          else
            commit_hash=$(git rev-parse --short HEAD)
            tag="preview"

            gh release delete "$tag" --yes || true
            git tag -d "$tag" || true
            git push origin :refs/tags/preview || true

            gh release create "$tag" \
              --target "${{ github.ref_name }}" \
              --prerelease \
              --notes "Preview - $commit_hash"
          fi

          apk_file=$(find ./artifacts -name "*.apk" | head -1)
          # Rename the file itself (gh's `#label` only sets a display label, not the asset name).
          cp "$apk_file" "quantumcast-$tag.apk"
          gh release upload "$tag" "quantumcast-$tag.apk" --clobber
