# QuantumCast - org toolchain baseline (matches RadioCapullo + the capullo-tech library
# repos). Introduced in the toolchain bump. The library recompose pruned the deps that moved into the
# libraries (Room/Retrofit/OkHttp/Ktor/NewPipe/snapcast/ffmpeg - now transitive via capullo-audio /
# capullo-source-radiobrowser); QC keeps only what its own UI + PlaybackService reference directly.
[versions]
# --- Toolchain (bumped to the org standard, validated together with Kotlin 2.3.10) ---
agp = "9.1.0"
kotlin = "2.3.10"
ksp = "2.3.9"                    # decoupled KSP line (drives Hilt codegen)
hilt = "2.59.2"                  # DI (org standard; RadioCapullo)
spotless = "8.3.0"               # code style (org standard, from RadioCapullo)
ktlint = "1.7.1"                 # Spotless drives ktlint
composeBom = "2026.02.01"
kotlinxSerializationJson = "1.10.0"   # MUST track the 2.3.10 serialization plugin (was 1.7.3)
# --- Compose-adjacent AndroidX (bumped to the org standard; a 2026 BOM wants the newer runtime) ---
coreKtx = "1.17.0"
lifecycle = "2.10.0"
activityCompose = "1.12.4"
# --- Independent deps (verbatim from QC's current build - NOT touched by the toolchain bump) ---
media = "1.7.0"
media3 = "1.9.0"
navigation3 = "1.0.1"           # Navigation3 (RadioCapullo) - replaced navigation-compose 2.7.7
coil = "2.6.0"
appcompat = "1.7.0"
material = "1.12.0"
datastore = "1.1.1"
reorderable = "2.4.3"
zxing = "3.5.3"
# capullo-source-radiobrowser (Layer 3, the radio ingress) - the library recompose consumes the extracted
# source library instead of QC's local data/{api,model,db,repository}, shazam/*, PlaylistResolver copies.
# Built from the sibling checkout via composite build when present (see settings.gradle toggle),
# else resolved from jitpack at this version.
# Pinned to an immutable jitpack commit (NOT main-SNAPSHOT): jitpack caches -SNAPSHOT artifacts
# unreliably (serves a stale build even after the metadata timestamp updates), which repeatedly broke
# CI. A commit coordinate is built once and served immutably. The composite-build substitution in
# settings.gradle ignores the version, so local co-development still builds the sibling from source.
capulloSourceRadiobrowser = "f3d8e0b"
# capullo-audio (Layer 2, the delivery engine) - the library recompose consumes the extracted engine's
# public transport classes (SnapserverProcess, SnapclientProcess, SnapcastControlClient,
# SnapcontrolPlugin, Nsd/Discovery, FIFO) instead of QC's local snapcast/* + player/FifoAudioSink
# copies. QC keeps its own PlaybackService orchestration (Strategy 1); the engine facade
# CapulloAudioEngine is intentionally NOT used. Composite build locally, jitpack on CI.
capulloAudio = "517eed5"  # pinned to an immutable jitpack commit (see the note above)
# --- Test ---
junit = "4.13.2"

[libraries]
# Compose (versions from the BOM)
androidx-compose-bom = { module = "androidx.compose:compose-bom", version.ref = "composeBom" }
androidx-compose-ui = { module = "androidx.compose.ui:ui" }
androidx-compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
androidx-compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling" }
androidx-compose-ui-test-manifest = { module = "androidx.compose.ui:ui-test-manifest" }
androidx-compose-material3 = { module = "androidx.compose.material3:material3" }
androidx-compose-material-icons-extended = { module = "androidx.compose.material:material-icons-extended" }
androidx-compose-foundation = { module = "androidx.compose.foundation:foundation" }
# AndroidX core / lifecycle / activity / nav
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "coreKtx" }
androidx-lifecycle-runtime-ktx = { module = "androidx.lifecycle:lifecycle-runtime-ktx", version.ref = "lifecycle" }
androidx-lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activityCompose" }
androidx-navigation3-runtime = { module = "androidx.navigation3:navigation3-runtime", version.ref = "navigation3" }
androidx-navigation3-ui = { module = "androidx.navigation3:navigation3-ui", version.ref = "navigation3" }
androidx-media = { module = "androidx.media:media", version.ref = "media" }
androidx-appcompat = { module = "androidx.appcompat:appcompat", version.ref = "appcompat" }
android-material = { module = "com.google.android.material:material", version.ref = "material" }
androidx-datastore-preferences = { module = "androidx.datastore:datastore-preferences", version.ref = "datastore" }
# Media3 / ExoPlayer
media3-exoplayer = { module = "androidx.media3:media3-exoplayer", version.ref = "media3" }
media3-exoplayer-hls = { module = "androidx.media3:media3-exoplayer-hls", version.ref = "media3" }
# Hilt (DI; drives KSP)
hilt-android = { module = "com.google.dagger:hilt-android", version.ref = "hilt" }
hilt-android-compiler = { module = "com.google.dagger:hilt-android-compiler", version.ref = "hilt" }
# Serialization runtime (Nav3 @Serializable route keys; tracks the 2.3.10 plugin)
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinxSerializationJson" }
# Images / misc
coil-compose = { module = "io.coil-kt:coil-compose", version.ref = "coil" }
reorderable = { module = "sh.calvin.reorderable:reorderable", version.ref = "reorderable" }
zxing-core = { module = "com.google.zxing:core", version.ref = "zxing" }
# capullo-tech first-party libraries (composite build locally, jitpack coordinate on CI)
capullo-source-radiobrowser = { module = "com.github.capullo-tech:capullo-source-radiobrowser", version.ref = "capulloSourceRadiobrowser" }
# jitpack multi-module coords: the engine (module name == repo name) is served flat AND nested;
# capullo-audio-ui (a non-repo-name module) is ONLY at the nested group com.github.capullo-tech.capullo-audio.
# Both must use the SAME (nested) group or Gradle sees the engine twice (flat direct + nested transitive
# via -ui) and fails on duplicate classes.
capullo-audio = { module = "com.github.capullo-tech.capullo-audio:capullo-audio", version.ref = "capulloAudio" }
# Shared client Compose UI (control sheet, QR dialog) - same repo/commit as the engine.
capullo-audio-ui = { module = "com.github.capullo-tech.capullo-audio:capullo-audio-ui", version.ref = "capulloAudio" }
# Test
junit = { module = "junit:junit", version.ref = "junit" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
# No kotlin.android: AGP 9.0+ ships built-in Kotlin (see RadioCapullo).
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
hilt = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }
spotless = { id = "com.diffplug.spotless", version.ref = "spotless" }
